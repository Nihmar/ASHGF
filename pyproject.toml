[project]
name = "ashgf"
version = "0.1.0"
description = "Production-quality implementation of ASHGF (Adaptive Stochastic Historical Gradient-Free Optimization) and related gradient-free optimization methods"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alessandro Manente" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "gymnasium>=1.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ashgf"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["original_python_code", "thesis"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]

[tool.pytest.ini_options]
testpaths = ["tests"]
